<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#091414">
  <title>星环守卫</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 27 9.5v13L16 29 5 22.5v-13Z"/><path d="m16 10 5 3v6l-5 3-5-3v-6Z"/></svg><div><h1>星环守卫</h1><span>ORBIT GUARD</span></div></div>
      <button id="currency-open" class="currency" aria-label="打开金币修改器"><span class="coin-icon">◇</span><strong id="coin-count">0</strong><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4 4 4M5 11l8-8 4 4-8 8-5 1Z"/></svg></button>
    </header>
    <section class="wavebar" aria-label="波次信息"><div><span class="eyebrow">当前波次</span><strong id="wave-number">01</strong><span id="wave-label">防线就绪</span></div><div class="record"><span class="eyebrow">最佳纪录</span><strong><span id="best-wave">0</span><small> 波</small></strong></div></section>
    <section id="arena" class="arena" aria-label="自动战斗区域">
      <canvas id="battlefield" aria-label="防御塔自动攻击靠近的敌人"></canvas>
      <div id="arena-message" class="arena-message" aria-live="polite">自动开火，点击下方升级</div>
      <div id="paused-badge" class="paused-badge" hidden><span>Ⅱ</span> 已暂停</div>
      <div class="arena-caption"><span class="live-dot"></span><span id="combat-status">自动防御中</span><span id="kill-count">击破 0</span></div>
      <div class="wave-track"><div id="wave-progress"></div></div>
    </section>
    <section class="health-section" aria-label="生命值"><div class="health-label"><span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 6 3v5c0 4-6 8-6 8S4 14 4 10V5Z"/></svg>防御塔生命</span><strong id="health-value">100 / 100</strong></div><div class="health-track"><div id="health-fill"></div></div></section>
    <section class="upgrades" aria-label="永久升级">
      <button class="upgrade" data-upgrade="damage"><div class="upgrade-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 2-9 12h7l-2 8 9-12h-7Z"/></svg><span>攻击</span><small id="level-damage">Lv.0</small></div><strong id="stat-damage">12</strong><span class="upgrade-unit">每次伤害</span><div class="upgrade-cost"><span>＋ 升级</span><b id="cost-damage">◇ 10</b></div></button>
      <button class="upgrade" data-upgrade="attackSpeed"><div class="upgrade-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l4 2M9 2h6M12 2v3"/><circle cx="12" cy="14" r="8"/></svg><span>攻速</span><small id="level-attackSpeed">Lv.0</small></div><strong id="stat-attackSpeed">1.2</strong><span class="upgrade-unit">每秒攻击</span><div class="upgrade-cost"><span>＋ 升级</span><b id="cost-attackSpeed">◇ 12</b></div></button>
      <button class="upgrade" data-upgrade="maxHp"><div class="upgrade-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6Z"/><path d="M12 8v8m-4-4h8"/></svg><span>生命</span><small id="level-maxHp">Lv.0</small></div><strong id="stat-maxHp">100</strong><span class="upgrade-unit">生命上限</span><div class="upgrade-cost"><span>＋ 升级</span><b id="cost-maxHp">◇ 10</b></div></button>
    </section>
    <footer class="controls"><button id="pause-button" class="control-button"><svg id="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4v12M13 4v12"/></svg><span id="pause-label">暂停</span></button><span class="save-hint" id="save-hint">金币与升级永久保留</span><button id="speed-button" class="control-button"><span id="speed-label">1×</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 5 5 5-5 5m7-10 5 5-5 5"/></svg></button></footer>
  </main>
  <div id="currency-modal" class="modal-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="currency-title">
      <button class="close-dialog" id="currency-close" aria-label="关闭金币修改器">×</button><span class="dialog-kicker">自由调整</span><h2 id="currency-title">金币修改器</h2><p>想升级多少，由你决定。</p>
      <label class="input-label" for="currency-input">金币总额</label><div class="currency-input-wrap"><span>◇</span><input id="currency-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" value="0"></div>
      <div class="presets"><button data-add="1000">+1,000</button><button data-add="10000">+1万</button><button data-add="1000000">+100万</button></div><p id="currency-error" class="input-error" aria-live="polite"></p><button id="currency-apply" class="primary-button">保存金币</button><span class="dialog-note">仅修改本游戏金币 · 无充值</span>
    </section>
  </div>
  <div id="result-modal" class="modal-backdrop" hidden>
    <section class="dialog result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title"><div class="result-symbol">◇</div><span class="dialog-kicker">本次防御结束</span><h2 id="result-title">再守一轮。</h2><div class="result-stats"><div><span>抵达波次</span><strong id="result-wave">1</strong></div><div><span>本轮金币</span><strong id="result-coins">0</strong></div><div><span>击破敌人</span><strong id="result-kills">0</strong></div></div><p>金币与升级已保留，下次更强。</p><button id="restart-button" class="primary-button">重新挑战</button></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
